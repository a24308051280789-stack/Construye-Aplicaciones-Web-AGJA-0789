<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Campos Ocultos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <h2>Formulario con campos ocultos</h2>
    <form action="" method="post">
        <!-- type="hidden" almacena datos invisibles para el usuario que se envían internamente al servidor -->
        <!-- value="3:30" es el dato que viajará oculto -->
        <input type="hidden" name="hora" value="3:30">
        
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
