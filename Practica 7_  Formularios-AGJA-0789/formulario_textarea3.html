<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Textarea</title>
</head>
<body>
    <h2>Formulario con text area</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        
        Ingresa tu correo:
        <!-- type="email" valida que el texto tenga formato de correo -->
        <input type="email" name="correo">
        <br>
        
        Ingresa tus comentarios:
        <!-- <textarea> crea un área de texto multilínea para mensajes largos -->
        <!-- rows="1" especifica la cantidad de filas -->
        <!-- cols="10" especifica la cantidad de columnas de ancho -->
        <textarea name="comentarios" rows="1" cols="10"></textarea>
        <br>
        
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
