<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Limitaciones</title>
</head>
<body>
    <h2>Formulario con limitaciones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Atributo 'disabled': inactiva la casilla impidiendo que se escriba o modifique su contenido -->
        <input type="text" name="nombre" disabled><br>
        
        Contraseña:
        <!-- Atributo 'maxlength="5"': restringe el ingreso a un máximo absoluto de 5 caracteres -->
        <input type="password" name="pass" maxlength="5"><br>
        
        Comentarios:
        <!-- Atributo 'readonly': hace que el contenido sea editable solo para lectura; se ve pero no se puede alterar -->
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>
</body>
</html>
