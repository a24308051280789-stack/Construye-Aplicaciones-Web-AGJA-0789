<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario para Contraseñas</title>
</head>
<body>
    <h2>Formulario para contraseñas</h2>
    <form action="" method="post">
        Ingresa tu usuario:
        <input type="text" name="usuario">
        
        Ingresa tu contraseña:
        <!-- type="password" oculta los caracteres mostrando en cambio puntos -->
        <input type="password" name="pass">
        <br>
        
        <!-- Botón para enviar los datos -->
        <input type="submit" value="enviar">
        <!-- type="reset" crea un botón para limpiar/borrar todos los campos del formulario -->
        <input type="reset" value="borrar">
    </form>
</body>
</html>
