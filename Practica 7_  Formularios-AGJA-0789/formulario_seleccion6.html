<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Selección</title>
</head>
<body>
    <h2>Formularios con selección</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        
        Selecciona tu país:
        <!-- <select> crea un menú desplegable de opciones -->
        <select name="pais">
            <!-- <option> define cada elemento seleccionable de la lista -->
            <!-- value="..." es el identificador enviado al servidor al seleccionar dicha opción -->
            <option value="1">Argentina</option>
            <option value="2">España</option>
            <option value="3">México</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="6">El Salvador</option>
            <option value="7">Venezuela</option>
            <option value="8">Colombia</option>
        </select>
        <br>
        
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
