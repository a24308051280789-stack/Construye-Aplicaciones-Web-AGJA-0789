<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Botones</title>
    <!-- Librería Font Awesome para cargar iconos <i> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <h2>Formulario con botones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        
        <!-- La etiqueta <button> permite incrustar etiquetas complejas en su interior, como imágenes o iconos -->
        <!-- type="submit" define la función de enviar -->
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <!-- type="reset" define la función de reiniciar campos -->
        <button type="reset">Borrar <i class="fa fa-trash"></i></button>
    </form>
</body>
</html>
