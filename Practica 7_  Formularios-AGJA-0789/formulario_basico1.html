<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Básico</title>
</head>
<body>
    <h2>Ejemplo básico</h2>
    <!-- form define el inicio del formulario -->
    <!-- action="" indica la URL que procesará los datos; method="post" envía la información de forma oculta -->
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- type="text" crea una casilla de texto simple -->
        <!-- name="nombre" identifica los datos -->
        <!-- size="20" es el tamaño del recuadro -->
        <input type="text" name="nombre" size="20">
        <br> <!-- Salto de línea -->
        <!-- type="submit" crea el botón para enviar los datos del formulario -->
        <!-- value="enviar" define el texto dentro del botón -->
        <input type="submit" value="enviar">
    </form>
</body>
</html>
