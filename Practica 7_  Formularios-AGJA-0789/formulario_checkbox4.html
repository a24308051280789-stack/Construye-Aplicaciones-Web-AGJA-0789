<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Checkbox</title>
</head>
<body>
    <h2>Formularios con checkbox</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        
        Selecciona los lenguajes que conozcas:
        <br>
        <!-- type="checkbox" crea casillas de verificación donde se pueden seleccionar MÚLTIPLES opciones -->
        <input type="checkbox" name="Java"> Java <br>
        <input type="checkbox" name="Python"> Python <br>
        <input type="checkbox" name="C#"> C# <br>
        <input type="checkbox" name="Flutter"> Flutter <br>
    </form>
</body>
</html>
